       font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dim);
       padding:10px 16px;border-radius:14px;transition:all .18s;min-width:150px;}
  .tab:hover{border-color:#4a4660;color:var(--text);transform:translateY(-1px);}
  .tab.active{border-color:transparent;background:var(--gradient);color:#fff;box-shadow:0 6px 18px rgba(138,56,245,.4);}
  .tab .n{font-size:16px;font-weight:800;opacity:.85;}
  .tab .nm{font-size:16px;font-weight:700;white-space:nowrap;}

  .stage{max-width:1320px;margin:0 auto;padding:22px 24px 60px;}
  .meta-card{display:flex;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:18px;}
  .meta-card .blk{flex:1 1 200px;}
  .meta-card .lbl{font-size:16px;color:var(--dim);font-weight:600;margin-bottom:4px;}
  .meta-card .val{font-size:16px;line-height:1.55;}
  .meta-card .fit{display:inline-block;font-size:16px;font-weight:700;padding:3px 12px;border-radius:9999px;}
  .fit-best{background:rgba(34,197,94,.16);color:#4ade80;}
  .fit-good{background:rgba(138,56,245,.18);color:#c4a3ff;}
  .fit-mid{background:rgba(245,158,11,.16);color:#fbbf24;}

  .frame-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.5);background:#000;}
  iframe{width:100%;height:1280px;border:0;display:block;}
  .device-note{font-size:16px;color:var(--dim);text-align:center;margin-top:12px;}

  @media(max-width:640px){
    iframe{height:1680px;}
    .title-row h1{font-size:20px;}
  }
</style>

<section class="section"><div class="sec-head"><h2>지금 검증 중인 아이디어</h2><a href="#">전체 보기 →</a></div>

<footer>© 2026 Crowny · Material 3 Expressive 미리보기 (강디 제작)</footer>
<script>
var IDEAS=[
{cat:'🍳 생활',title:'냉장고 재료로 레시피 추천 AI',desc:'사진만 찍으면 남은 재료로 만들 수 있는 요리를 알려주는 앱.',paid:412,free:980},
{cat:'💪 헬스',title:'운동 자세 실시간 교정 코치',desc:'카메라로 스쿼트·푸시업 자세를 봐주는 AI 트레이너.',paid:688,free:540},
{cat:'📚 교육',title:'10분 출퇴근 영어 회화',desc:'지하철에서 딱 한 정거장, 짧은 회화 한 토픽씩.',paid:233,free:1120}
];
function pct(p,f){var t=p+f;return t?Math.round(p/t*100):0;}
var wrap=document.getElementById('cards');
IDEAS.forEach(function(d,i){
var el=document.createElement('article');el.className='idea';
function draw(){var p=pct(d.paid,d.free);
el.innerHTML='<span class="cat">'+d.cat+'</span><h3>'+d.title+'</h3><p class="desc">'+d.desc+'</p>'+
'<div class="bar"><i style="width:'+p+'%"></i></div>'+
'<div class="bar-lbl"><span>유료 의향 '+p+'%</span><span>총 '+(d.paid+d.free).toLocaleString()+'표</span></div>'+
'<div class="vote-row">'+
'<button class="vote-btn paid'+(d.vp?' on':'')+'"><span class="vn">'+d.paid.toLocaleString()+'</span>💎 유료라도 사용</button>'+
'<button class="vote-btn free'+(d.vf?' on':'')+'"><span class="vn">'+d.free.toLocaleString()+'</span>👥 무료라면 사용</button>'+
'</div><button class="share">🔗 공유하기</button>';
el.querySelector('.paid').onclick=function(){if(d.vp){d.paid--;d.vp=false;}else{d.paid++;d.vp=true;if(d.vf){d.free--;d.vf=false;}}draw();};
el.querySelector('.free').onclick=function(){if(d.vf){d.free--;d.vf=false;}else{d.free++;d.vf=true;if(d.vp){d.paid--;d.vp=false;}}draw();};
el.querySelector('.share').onclick=function(){this.textContent='✅ 링크 복사됨';var b=this;setTimeout(function(){b.innerHTML='🔗 공유하기';},1400);};
}
draw();wrap.appendChild(el);
});
</script></body></html>

el.querySelector('.share').onclick=function(){this.textContent='✅ 링크 복사됨';var b=this;setTimeout(function(){b.innerHTML='🔗 공유하기';},1400);};
}
draw();wrap.appendChild(el);
});
</script></body></html>

<!-- STYLE_DATA_END -->

<script>
(function(){
  const tabs = document.getElementById('tabs');
  const meta = document.getElementById('meta');
  const frameWrap = document.getElementById('frameWrap');
  function fitClass(f){return f==='best'?'fit-best':f==='good'?'fit-good':'fit-mid';}
  function render(idx){
    [...tabs.children].forEach((t,i)=>t.classList.toggle('active',i===idx));
    const s = STYLES[idx];
    meta.innerHTML =
      '<div class="meta-card">'+
        '<div class="blk"><div class="lbl">스타일</div><div class="val"><b>'+s.name+'</b></div></div>'+
        '<div class="blk"><div class="lbl">특징</div><div class="val">'+s.feature+'</div></div>'+
        '<div class="blk"><div class="lbl">라이선스</div><div class="val">'+s.license+'</div></div>'+
        '<div class="blk"><div class="lbl">Crowny 적합도</div><div class="val"><span class="fit '+fitClass(s.fitLevel)+'">'+s.fit+'</span></div></div>'+
      '</div>';
    const tpl = document.querySelector('template[data-style="'+s.num+'"]');
    const ifr = document.createElement('iframe');
    ifr.setAttribute('title', s.name+' 미리보기');
    ifr.srcdoc = tpl ? tpl.innerHTML : '<p style="color:#fff;padding:24px">미리보기 #'+s.num+' 누락</p>';
    frameWrap.innerHTML='';
    frameWrap.appendChild(ifr);
  }
  STYLES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab';
    b.innerHTML='<span class="n">#'+s.num+'</span><span class="nm">'+s.short+'</span>';
    b.onclick=()=>render(i);
    tabs.appendChild(b);
  });
  const def = STYLES.findIndex(s=>s.num==='02');
  render(def>=0?def:0);
})();
</script>
</body>
</html>
